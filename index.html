<!DOCTYPE html>
<html>

<head>
    <title>Pacman Empanada</title>
    <link rel="icon" type="image/png" href="Logo Mi Gusto 2025.png">
    <link rel="stylesheet" href="Style.css">
    <script src="//cdn.jsdelivr.net/npm/phaser@3.12/dist/phaser.js"></script>
</head>

<body>
    <img src="Logo Mi Gusto 2025.png" class="logo-top-left" alt="Logo">

    <div class="container">
        <div class="social-links">
            <div id="pacman-banner">
                <img src="pacman-empanada.png" class="title-icon" alt="icon">
                PacMan Empanada
            </div>
        </div>
    </div>

    <div class="container game-container">
        <canvas id="mycanvas"></canvas>
    </div>

    <script>
        window.twttr = (function (d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0],
                t = window.twttr || {};
            if (d.getElementById(id)) return t;
            js = d.createElement(s);
            js.id = id;
            js.src = "https://platform.twitter.com/widgets.js";
            fjs.parentNode.insertBefore(js, fjs);
            t._e = [];
            t.ready = function (f) {
                t._e.push(f);
            };
            return t;
        }(document, "script", "twitter-wjs"));
    </script>
    <script src="script.js"></script>
</body>

</html>
